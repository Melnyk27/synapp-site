<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Downloads — TakeSync</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css?v=20261026b">
</head>
<body>
<main class="container narrow" style="padding:64px 16px;text-align:center;">
  <section id="login" hidden>
    <h1 style="font-size:28px;margin-bottom:16px;">Stats</h1>
    <form id="login-form" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
      <input id="token" type="password" placeholder="Admin token" autocomplete="current-password" style="padding:12px 14px;border-radius:10px;border:1px solid #262b34;background:#15181e;color:#e9ecf0;min-width:260px;">
      <button class="btn btn-primary" type="submit">Open</button>
    </form>
    <p id="err" style="color:#ff5c74;margin-top:12px;"></p>
  </section>
  <section id="data" hidden>
    <p style="color:#9aa4b1;margin:0;">Downloads</p>
    <p id="total" style="font-size:96px;line-height:1;font-weight:800;margin:8px 0 24px;">–</p>
    <p style="color:#9aa4b1;">Today <b id="today">–</b> · 30 days <b id="month">–</b> · Trials started (30 d) <b id="trials">–</b> · Email clicks (30 d) <b id="clicks">–</b></p>
    <table style="margin:28px auto 0;border-collapse:collapse;text-align:left;min-width:280px;">
      <thead><tr><th style="padding:6px 14px;color:#9aa4b1;">Source</th><th style="padding:6px 14px;color:#9aa4b1;">Downloads</th><th style="padding:6px 14px;color:#9aa4b1;">Email clicks</th></tr></thead>
      <tbody id="refs"></tbody>
    </table>
    <p style="margin-top:28px;"><button id="refresh" class="btn btn-sm" type="button">Refresh</button> <button id="logout" class="btn btn-sm" type="button">Log out</button></p>
    <p id="status" class="small" style="color:#6b7684;"></p>
  </section>
</main>
<script src="/stats.js?v=1"></script>
</body>
</html>
